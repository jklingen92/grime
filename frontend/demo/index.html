<!doctype html>
<!-- Static demo of grime's dashboard. Markup follows
     grime/templates/grime/base.html + document_list.html; rows come from
     demo-data/manifest.json (python manage.py export_demo --page A --page B). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grime demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../../grime/static/grime/base.css">
  <link rel="stylesheet" href="../../grime/static/grime/document-list.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>

<div id="gd-header">
  <h1>Documents</h1>
</div>
<div id="demo-banner" role="note">
  <span>
    <strong>Demo:</strong> a static copy of grime. Open a document to correct its OCR and
    annotate regions; each demo document includes one page. Uploading, jobs and exports are off,
    and edits stay in your browser.
    <a href="https://github.com/jklingen92/grime">Source on GitHub</a>
  </span>
</div>

<main style="padding:12px 16px">

  <!-- Document list, filled by demo-list.js -->
  <div id="gl-docs">
    <h2 class="h6 fw-semibold mb-3" style="color:var(--grime-primary)">All documents (<span id="demo-doc-count">0</span>)</h2>
    <div class="table-responsive">
      <table class="table table-hover table-sm align-middle mb-0">
        <thead>
          <tr>
            <th>Title</th>
            <th>Labels</th>
            <th>Pages</th>
            <th class="text-center">Entities</th>
          </tr>
        </thead>
        <tbody id="demo-doc-rows"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- Bootstrap JS drives the intro modal (tour.js). -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script type="module" src="./demo-list.js"></script>
</body>
</html>
