<!doctype html>
<!-- Static demo of grime's document viewer, opened as viewer.html?page=<pk>.
     Markup follows grime/templates/grime/base.html + document_detail.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grime viewer demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../../grime/static/grime/base.css">
  <link rel="stylesheet" href="../../grime/static/grime/viewer.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>

<div id="gd-header">
  <a href="./">Grime</a>
  <i class="fa-solid fa-chevron-right fa-xs mx-1"></i>
  <h1 id="demo-title"></h1>
</div>
<div id="demo-banner" role="note">
  <span>
    <strong>Demo:</strong> a static copy of grime's document viewer. The OCR here
    was poorly run, so there's plenty to correct. OCR/NER jobs, PDF export and saving image
    adjustments are off, and edits stay in your browser.
    <a href="https://github.com/jklingen92/grime">Source on GitHub</a>
  </span>
  <button id="demo-reset" type="button" class="btn btn-sm btn-outline-dark">Reset page</button>
</div>

<main id="gd-body" style="padding:12px 16px">
  <div id="viewer-root"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script type="module" src="./demo-page.jsx"></script>
</body>
</html>
