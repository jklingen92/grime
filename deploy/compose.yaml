# Production stack for the demo project, reachable only over a private VPN (e.g. ZeroTier).
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml run --rm web python manage.py migrate
#   docker compose -f deploy/compose.yaml run --rm web python manage.py createsuperuser

# Explicit project name; compose.dev.yaml shares this directory.
name: grime-prod

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: grime-prod
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://grime:${POSTGRES_PASSWORD}@db:5432/grime
    STATIC_ROOT: /data/static
    MEDIA_ROOT: /data/media
  volumes:
    - media:/data/media
  depends_on:
    - db

# Workers run torch NER, so they get the GPU (needs nvidia-container-toolkit on the host).
x-worker: &worker
  <<: *app
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: grime
      POSTGRES_DB: grime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    <<: *app
    # collectstatic on start refreshes the shared static volume after each rebuild.
    command: sh -c "python manage.py collectstatic --noinput && exec gunicorn demo.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - media:/data/media
      - static:/data/static

  # One service per slot; keep in sync with GRIME_WORKER_SLOTS in .env.
  worker1:
    <<: *worker
    command: python manage.py run_worker --slot=1
  worker2:
    <<: *worker
    command: python manage.py run_worker --slot=2
  worker3:
    <<: *worker
    command: python manage.py run_worker --slot=3

  # Serves static and media directly; everything else goes to gunicorn.
  # Bound to the VPN IP only, so it isn't reachable from the LAN or internet.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${BIND_IP}:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
  static:
